<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherOS — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0c;
      --bg2: #141414;
      --bg3: #1a1a1a;
      --gold: #c8a84b;
      --gold2: #e0c87a;
      --red: #e23744;
      --green: #22c55e;
      --text: #f0ede8;
      --muted: #888;
      --border: rgba(255,255,255,0.07);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 64px; background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 8px; flex-shrink: 0;
    }
    .sb-logo {
      width: 38px; height: 38px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1rem; color: #000; margin-bottom: 20px;
    }
    .sb-btn {
      width: 42px; height: 42px; border-radius: 10px; border: none; background: transparent;
      color: var(--muted); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .sb-btn:hover, .sb-btn.active { background: rgba(200,168,75,0.12); color: var(--gold); }
    .sb-sep { width: 30px; height: 1px; background: var(--border); margin: 6px 0; }
    .sb-btn.logout { margin-top: auto; color: var(--red); }
    .sb-btn.logout:hover { background: rgba(226,55,68,0.12); }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--bg2);
      gap: 15px;
    }
    .topbar-brand { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem; }
    .topbar-brand span { color: var(--gold); }
    .topbar-sub { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
    
    .topbar-actions {
      display: flex; align-items: center; gap: 16px;
    }
    .return-home-btn {
      background: rgba(200, 168, 75, 0.08);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .return-home-btn:hover {
      background: var(--gold);
      color: #000;
      box-shadow: 0 4px 12px rgba(200, 168, 75, 0.25);
    }
    .online-badge {
      display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--green); font-weight: 600; letter-spacing: 1px;
    }
    .online-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .content { flex: 1; display: flex; overflow: hidden; }

    /* ORDERS PANEL */
    .orders-panel { flex: 1; padding: 28px; overflow-y: auto; border-right: 1px solid var(--border); }
    .panel-title { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; }
    .panel-sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; margin-bottom: 24px; }
    .orders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .orders-col-header { font-size: 0.75rem; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .dot-green { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .dot-red { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    .badge { font-size: 0.7rem; background: rgba(255,255,255,0.06); color: var(--muted); padding: 2px 8px; border-radius: 20px; margin-left: auto; }

    .order-card {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 12px; transition: all 0.2s;
    }
    .order-card:hover { border-color: rgba(200,168,75,0.2); }
    .order-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .order-name { font-weight: 600; font-size: 0.95rem; }
    .order-date { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .order-complete-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--green);
      background: rgba(34,197,94,0.1); color: var(--green); font-size: 0.8rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .order-complete-btn:hover { background: var(--green); color: #000; }
    .order-item-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
    .order-item-img { width: 28px; height: 28px; border-radius: 5px; object-fit: cover; background: #333; }
    .order-item-name { font-size: 0.85rem; flex: 1; }
    .order-item-qty { font-size: 0.75rem; color: var(--muted); background: rgba(255,255,255,0.06); padding: 2px 7px; border-radius: 10px; }
    .order-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .order-address { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .order-total { font-size: 0.95rem; font-weight: 700; color: var(--gold); }
    .delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; padding: 4px; border-radius: 4px; }
    .delete-btn:hover { color: var(--red); }
    .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }

    /* SIDEBAR RIGHT */
    .right-panel { width: 340px; flex-shrink: 0; padding: 28px; overflow-y: auto; }
    .right-panel h2 { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
    .form-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.9rem; padding: 10px 12px;
      margin-bottom: 14px; transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--gold); }
    .brew-btn {
      width: 100%; padding: 13px; background: var(--gold); color: #000; border: none;
      border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1rem;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; margin-top: 4px;
    }
    .brew-btn:hover { background: var(--gold2); transform: translateY(-1px); }
    .success-msg { color: var(--green); font-size: 0.82rem; text-align: center; margin-top: 10px; display: none; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .stat-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .stat-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; }
    .stat-value.gold { color: var(--gold); }
    .stat-value.green { color: var(--green); }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* RESPONSIVE DESIGN (MOBILE & TABLET) */
    @media (max-width: 900px) {
      body { flex-direction: column; }
      
      .sidebar {
        width: 100%;
        height: 60px;
        flex-direction: row;
        padding: 10px 20px;
        border-right: none;
        border-bottom: 1px solid var(--border);
        justify-content: space-around;
        gap: 15px;
      }
      .sb-logo { margin-bottom: 0; display: none; }
      .sidebar .sb-sep { display: none; }
      .sb-btn.logout { margin-top: 0; }

      .topbar {
        padding: 14px 20px;
      }
      .topbar-sub { display: none; }
      .topbar-actions { gap: 10px; }
      .return-home-btn { padding: 6px 12px; font-size: 0.75rem; }

      .content {
        flex-direction: column;
        overflow-y: auto;
      }
      
      .orders-panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 20px;
        overflow-y: visible;
        flex: none;
      }
      
      .orders-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .right-panel {
        width: 100%;
        padding: 20px;
        overflow-y: visible;
        flex: none;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sb-logo">A</div>
  <button class="sb-btn active" title="Orders">📦</button>
  <div class="sb-sep"></div>
  <button class="sb-btn" title="Products">🛍️</button>
  <button class="sb-btn" title="Stats">📊</button>
  <button class="sb-btn logout" title="Return to Homepage" onclick="window.location.href='/'">↩</button>
</nav>

<!-- MAIN -->
<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <div class="topbar-brand">Aether<span>OS</span></div>
      <div class="topbar-sub">Operational Command System</div>
    </div>
    
    <div class="topbar-actions">
      <a href="/" class="return-home-btn">
        <span>←</span> Return to Homepage
      </a>
      <div class="online-badge">
        <div class="online-dot"></div>
        ONLINE
      </div>
    </div>
  </div>

  <div class="content">
    <!-- ORDERS -->
    <div class="orders-panel">
      <div class="panel-title">Live Orders</div>
      <div class="panel-sub">Real-time pulse of your cafe.</div>

      <div class="orders-grid">
        <div>
          <div class="orders-col-header">
            <div class="dot-green"></div>
            ACTIVE FEED
            <span class="badge" id="active-count">0 PENDING</span>
          </div>
          <div id="active-orders"></div>
        </div>
        <div>
          <div class="orders-col-header">
            <div class="dot-red"></div>
            CANCELLED
            <span class="badge" id="cancelled-count">0 VOID</span>
          </div>
          <div id="cancelled-orders"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <!-- STATS -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value gold" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Revenue</div>
          <div class="stat-value green" id="stat-revenue">₹0</div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- ADD PRODUCT FORM -->
      <h2>+ Add Product</h2>
      <label class="form-label">Product Name</label>
      <input class="form-input" id="p-name" placeholder="e.g. Signature Espresso">
      <label class="form-label">Price (₹)</label>
      <input class="form-input" id="p-price" type="number" placeholder="450.00">
      <label class="form-label">Category</label>
      <input class="form-input" id="p-category" placeholder="Drinks, Bestseller">
      <label class="form-label">Image URL</label>
      <input class="form-input" id="p-image" placeholder="/image.png">
      <label class="form-label">Description</label>
      <input class="form-input" id="p-desc" placeholder="A rich, dark blend...">
      <button class="brew-btn" onclick="addProduct()">☕ BREW PRODUCT</button>
      <div class="success-msg" id="success-msg">✅ Product added successfully!</div>
    </div>
  </div>
</div>

<script>
  function getOrders() {
    return JSON.parse(localStorage.getItem('aether_orders') || '[]');
  }
  function saveOrders(orders) {
    localStorage.setItem('aether_orders', JSON.stringify(orders));
  }
  function getProducts() {
    return JSON.parse(localStorage.getItem('aether_products') || '[]');
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { month: 'short', day: '2-digit', year: 'numeric' }) + ', ' +
           d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function calcTotal(items) {
    if (!items) return 0;
    return items.reduce((s, i) => {
      const p = parseFloat((i.price || '0').toString().replace('₹',''));
      return s + (p * (i.quantity || 1));
    }, 0);
  }

  function renderOrder(order, showDelete) {
    const items = order.items || [];
    const total = order.total_amount || calcTotal(items);
    const div = document.createElement('div');
    div.className = 'order-card';

    const itemsHtml = items.map(it => `
      <div class="order-item-row">
        <img class="order-item-img" src="${it.image || '/cappuccino.png'}" onerror="this.src='/cappuccino.png'">
        <span class="order-item-name">${it.product_name || it.name || 'Item'}</span>
        <span class="order-item-qty">${it.quantity || 1}x</span>
      </div>`).join('');

    div.innerHTML = `
      <div class="order-header">
        <div>
          <div class="order-name">${order.customer_name || 'Customer'}</div>
          <div class="order-date">${formatDate(order.created_at)}</div>
        </div>
        ${!showDelete ? `<button class="order-complete-btn" onclick="completeOrder('${order.id}')" title="Mark Complete">✓</button>` : `<button class="delete-btn" onclick="deleteOrder('${order.id}')" title="Remove">🗑</button>`}
      </div>
      ${itemsHtml}
      <div class="order-footer">
        <div class="order-address">📍 ${(order.address || '').slice(0, 30) || 'N/A'}</div>
        <div class="order-total">₹${parseFloat(total).toFixed(2)}</div>
      </div>`;
    return div;
  }

  function renderOrders() {
    const orders = getOrders();
    const active = orders.filter(o => o.status !== 'Cancelled' && o.status !== 'completed');
    const cancelled = orders.filter(o => o.status === 'Cancelled');

    const activeEl = document.getElementById('active-orders');
    const cancelledEl = document.getElementById('cancelled-orders');

    activeEl.innerHTML = '';
    cancelledEl.innerHTML = '';

    document.getElementById('active-count').textContent = active.length + ' PENDING';
    document.getElementById('cancelled-count').textContent = cancelled.length + ' VOID';

    if (active.length === 0) activeEl.innerHTML = '<div class="empty-state">No active orders</div>';
    active.forEach(o => activeEl.appendChild(renderOrder(o, false)));

    if (cancelled.length === 0) cancelledEl.innerHTML = '<div class="empty-state">No cancelled orders</div>';
    cancelled.forEach(o => cancelledEl.appendChild(renderOrder(o, true)));

    // Stats
    const total = orders.length;
    const revenue = orders.filter(o => o.status !== 'Cancelled').reduce((s, o) => {
      return s + parseFloat(o.total_amount || calcTotal(o.items || []));
    }, 0);
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-revenue').textContent = '₹' + revenue.toFixed(0);
  }

  function completeOrder(id) {
    const orders = getOrders().map(o => o.id === id ? { ...o, status: 'completed' } : o);
    saveOrders(orders);
    renderOrders();
  }

  function deleteOrder(id) {
    const orders = getOrders().filter(o => o.id !== id);
    saveOrders(orders);
    renderOrders();
  }

  function addProduct() {
    const name = document.getElementById('p-name').value.trim();
    const price = parseFloat(document.getElementById('p-price').value);
    const category = document.getElementById('p-category').value.trim();
    const image = document.getElementById('p-image').value.trim();
    const desc = document.getElementById('p-desc').value.trim();

    if (!name || !price) return alert('Name aur Price zaroori hain!');

    const products = getProducts();
    const newProduct = {
      id: 'prod_' + Math.random().toString(36).substr(2, 9),
      name, price, category, image: image || '/cappuccino.png', desc, is_available: true
    };
    products.push(newProduct);
    localStorage.setItem('aether_products', JSON.stringify(products));

    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-category').value = '';
    document.getElementById('p-image').value = '';
    document.getElementById('p-desc').value = '';

    const msg = document.getElementById('success-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 3000);
  }

  // Auto-refresh every 10 seconds
  renderOrders();
  setInterval(renderOrders, 10000);
</script>
</body>
</html>
