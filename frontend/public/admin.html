<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether - Admin Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700;800&display=swap');

    :root {
      --bg-primary: #0a0908;
      --bg-secondary: #161412;
      --bg-overlay: rgba(22, 20, 18, 0.7);
      --accent-gold: #c69f50;
      --accent-gold-hover: #e0c184;
      --text-primary: #f8f6f0;
      --text-secondary: #a39c94;
      --border-light: rgba(198, 159, 80, 0.15);
      
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: linear-gradient(rgba(10, 9, 8, 0.6), rgba(10, 9, 8, 0.75)), url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&q=80');
      background-size: cover;
      background-position: center;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      font-weight: 700;
      line-height: 1.2;
    }

    .admin-container {
      width: 100%;
      max-width: 450px;
      padding: 3rem;
      background: var(--bg-overlay);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .brand-logo span {
      color: var(--accent-gold);
    }

    .subtitle {
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .input-group input {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent-gold);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(198, 159, 80, 0.2);
    }

    .btn-login {
      width: 100%;
      background-color: var(--accent-gold);
      color: var(--bg-primary);
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 1rem;
    }

    .btn-login:hover {
      background-color: var(--accent-gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(198, 159, 80, 0.3);
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="brand-logo">Aether<span>.</span></div>
    <div class="subtitle">Admin Portal Login</div>

    <form onsubmit="event.preventDefault(); alert('Admin panel integration coming soon!');">
      <div class="input-group">
        <label for="username">Username / Email</label>
        <input type="text" id="username" placeholder="admin@aether.com" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <a href="/" class="back-link">← Return to Store</a>
  </div>

</body>
</html>
